<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | Bryan Paul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="minimal-overrides.css">
    <link rel="stylesheet" href="project-page.css">
    <script src="project-page.js" defer></script>
</head>
<body class="project-page">
    <main class="project-detail-page">
        <a class="project-back-link" href="index.html#works">← Back to works</a>
        <div class="project-detail-heading">
            <div>
                <p class="project-detail-kicker" id="project-tags"></p>
                <h1 id="project-title"></h1>
                <p class="project-detail-summary" id="project-summary"></p>
            </div>
        </div>

        <dl class="project-facts" id="project-facts"></dl>

        <figure class="project-hero-image">
            <div id="project-hero-content"></div>
            <button class="project-media-arrow project-media-arrow-left" id="project-media-previous" type="button" aria-label="Show previous project media">←</button>
            <button class="project-media-arrow project-media-arrow-right" id="project-media-next" type="button" aria-label="Show next project media">→</button>
        </figure>

        <section class="project-story">
            <div>
                <p class="project-story-label">About the project</p>
            </div>
            <div>
                <p id="project-description"></p>
                <div class="project-gallery" id="project-gallery"></div>
            </div>
        </section>

        <section class="project-impact" aria-labelledby="project-impact-title">
            <p class="project-story-label" id="project-impact-title">Impact</p>
            <div class="project-impact-metrics" id="project-impact-metrics"></div>
        </section>
    </main>
</body>
</html>
